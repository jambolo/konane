[workspace]
members = ["."]
resolver = "2"

[package]
name = "konane"
version = "1.0.0"

edition = "2024"

[features]
default = ["random-openings"]
# Collapse each opening removal to one randomly chosen move instead of searching every candidate.
random-openings = []

[dependencies]
iced = { version = "0.14", features = ["image", "canvas", "tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.10"
rand_chacha = "0.10"
game-player = { git = "https://github.com/jambolo/game-player.git", tag = "v0.4.0" }
tokio = { version = "1", features = ["rt-multi-thread"] }
clap = { version = "4", features = ["derive"] }

# Optimize dependencies in debug builds
[profile.dev.package."*"]
opt-level = 3
