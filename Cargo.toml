[workspace]
members = [".", "game-player"]
resolver = "2"

[package]
name = "konane"
version = "1.0.0"

edition = "2024"

[features]
default = ["random-openings", "use-mcts"]
# Collapse each opening removal to one randomly chosen move instead of searching every candidate.
random-openings = []
# Drive the AI with game-player's MCTS search instead of minimax. With this feature, --ai-depth
# becomes an iteration budget multiplier (depth x 1000 MCTS iterations per move).
use-mcts = []

[dependencies]
iced = { version = "0.14", features = ["image", "canvas", "tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"
rand_chacha = "0.10"
ndarray = "0.17"
game-player = { path = "game-player" }
tokio = { version = "1", features = ["rt-multi-thread"] }
clap = { version = "4", features = ["derive"] }
